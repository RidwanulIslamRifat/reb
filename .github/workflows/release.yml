name: Release

# Publishes reb to npm when the owner publishes a GitHub release (see docs/RELEASING.md).
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets GitHub prove to npm who is publishing, and adds provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check the release tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"
          if [ "${tag}" != "v${version}" ]; then
            echo "::error::The release tag is ${tag} but package.json says ${version}. Name the tag v${version}, or change the version in package.json first."
            exit 1
          fi
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Update npm (trusted publishing needs npm 11.5.1 or newer)
        run: npm install -g npm@latest
      - run: npm publish --provenance --access public
