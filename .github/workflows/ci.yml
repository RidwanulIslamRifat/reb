name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      # Formatting and types do not depend on the operating system: check them once.
      - if: matrix.os == 'ubuntu-latest'
        run: npm run lint
      - if: matrix.os == 'ubuntu-latest'
        run: npm run typecheck
      # Build first: the package test checks what `npm pack` would publish, including dist/.
      - run: npm run build
      - run: npm test
      - run: node dist/cli.js --version
